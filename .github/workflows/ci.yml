name: PHP checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check PHP syntax
        run: find public src tests -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Check configuration example
        run: php -l config.example.php
      - name: Run submission tests
        run: php tests/run.php
      - name: Run HTTP tests with local mail capture
        run: python3 tests/http_test.py
